[project]
name = "dynamic-pricing-parking"
version = "1.0.0"
description = "Real-time dynamic pricing engine for urban parking lots (baseline / demand / competitive models) with a Pathway streaming layer and Bokeh dashboards."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]      # errors, pyflakes, import-sort, warnings
ignore = ["E501"]                   # long lines in comments are fine here

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
