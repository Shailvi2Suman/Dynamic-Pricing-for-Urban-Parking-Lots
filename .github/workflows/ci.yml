name: CI

# Runs on every push and pull request to main — this is the "CD" trigger point
# and the proof that the code stays green. Talk about this in the interview:
# "every commit runs lint + the full test suite before it can merge."

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the pipeline (synthetic sample, no large data needed)
        run: python run_batch.py --sample

      - name: Smoke-test the modeling + evaluation
        run: python run_analysis.py --sample
